<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#1a3a2a"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <rect width="800" height="470" fill="#f8f3e8"/>

  <!-- hero: village header -->
  <rect x="0" y="0" width="800" height="180" fill="url(#sky)"/>
  <!-- hills -->
  <path d="M0 180 Q120 118 260 164 Q380 200 520 150 Q660 104 800 158 L800 180 Z" fill="#245a42"/>
  <!-- gonjong silhouette -->
  <g fill="#132b1f">
    <path d="M330 150 Q355 142 368 112 Q371 104 374 112 Q382 136 400 128 Q404 112 408 100 Q412 112 416 128 Q434 136 442 112 Q445 104 448 112 Q461 142 486 150 L486 166 L330 166 Z"/>
    <rect x="352" y="150" width="112" height="16"/>
  </g>
  <text x="36" y="64" fill="#f8f3e8" font-size="26" font-weight="800">Korong Padang Jambu</text>
  <text x="36" y="90" fill="#e8c97a" font-size="13">Nagari Guguak Kuranji Hilir · Padang Pariaman</text>
  <rect x="36" y="110" width="128" height="30" rx="15" fill="#e8c97a"/>
  <text x="58" y="130" fill="#1a3a2a" font-size="12" font-weight="700">Layanan Surat</text>
  <rect x="174" y="110" width="118" height="30" rx="15" fill="none" stroke="#f8f3e8" stroke-opacity="0.7"/>
  <text x="196" y="130" fill="#f8f3e8" font-size="12">Aspirasi</text>

  <!-- stat cards -->
  <g font-size="11">
    <rect x="36" y="206" width="170" height="78" rx="10" fill="#fefdfb" stroke="#2d6a4f22"/>
    <text x="56" y="238" fill="#2d6a4f" font-size="26" font-weight="800">1.240</text>
    <text x="56" y="260" fill="#5c3d2e">Jiwa</text>
    <rect x="222" y="206" width="170" height="78" rx="10" fill="#fefdfb" stroke="#2d6a4f22"/>
    <text x="242" y="238" fill="#2d6a4f" font-size="26" font-weight="800">342</text>
    <text x="242" y="260" fill="#5c3d2e">Kepala Keluarga</text>
    <rect x="408" y="206" width="170" height="78" rx="10" fill="#fefdfb" stroke="#2d6a4f22"/>
    <text x="428" y="238" fill="#9b2335" font-size="26" font-weight="800">4</text>
    <text x="428" y="260" fill="#5c3d2e">Wilayah RW</text>
  </g>

  <!-- announcement card -->
  <rect x="36" y="306" width="368" height="128" rx="10" fill="#fefdfb" stroke="#2d6a4f22"/>
  <rect x="56" y="326" width="74" height="20" rx="10" fill="#9b2335"/>
  <text x="68" y="340" fill="#fefdfb" font-size="10" font-weight="700">PENTING</text>
  <text x="56" y="372" fill="#1a3a2a" font-size="15" font-weight="700">Gotong royong bersama</text>
  <rect x="56" y="388" width="300" height="7" rx="3.5" fill="#5c3d2e22"/>
  <rect x="56" y="402" width="236" height="7" rx="3.5" fill="#5c3d2e22"/>

  <!-- bar chart: demografi -->
  <rect x="424" y="306" width="340" height="128" rx="10" fill="#fefdfb" stroke="#2d6a4f22"/>
  <text x="444" y="332" fill="#1a3a2a" font-size="12" font-weight="700">Penduduk per kelompok umur</text>
  <g fill="#2d6a4f">
    <rect x="452" y="384" width="30" height="34" rx="3"/>
    <rect x="496" y="366" width="30" height="52" rx="3"/>
    <rect x="540" y="352" width="30" height="66" rx="3"/>
    <rect x="584" y="372" width="30" height="46" rx="3"/>
    <rect x="628" y="394" width="30" height="24" rx="3" fill="#e8c97a"/>
    <rect x="672" y="400" width="30" height="18" rx="3" fill="#e8c97a"/>
  </g>

  <!-- admin portal chip -->
  <rect x="596" y="206" width="168" height="78" rx="10" fill="#1a3a2a"/>
  <circle cx="622" cy="238" r="12" fill="none" stroke="#e8c97a" stroke-width="2"/>
  <path d="M616 238 l4 4 8 -8" fill="none" stroke="#e8c97a" stroke-width="2" stroke-linecap="round"/>
  <text x="644" y="235" fill="#f8f3e8" font-size="12" font-weight="700">Portal Admin</text>
  <text x="644" y="254" fill="#f8f3e8" font-size="10" opacity="0.75">login · role access</text>
</svg>
